[package]
name = "local-websearch-mcp"
version = "0.1.0"
edition = "2024"
description = "Local web-search MCP server (Streamable HTTP transport)"
license = "MIT"

[features]
default = []
# Optional HTTPS serving (config-gated at runtime via [server.tls]). Off by default.
tls = ["dep:axum-server"]

[dependencies]
# MCP server + Streamable HTTP transport (also enables `server` + `macros`).
rmcp = { version = "3.5", features = ["transport-streamable-http-server"] }
# Optional HTTPS server (only built with the `tls` feature). Uses the same
# rustls 0.23 / aws-lc-rs stack as reqwest, so no second TLS implementation.
axum-server = { version = "0.8", optional = true, default-features = false, features = ["tls-rustls"] }
# HTTP server / router for the Streamable HTTP Tower service.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Outbound HTTP client. `rustls` keeps the build free of OpenSSL on Windows/Linux.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "charset"] }
# Pure-Rust HTML parsing for the DuckDuckGo provider and readable-text fallback.
tl = "0.7"
# URL parsing / relative-link resolution (already a transitive reqwest dependency).
url = "2"
# CLI + TOML configuration.
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1